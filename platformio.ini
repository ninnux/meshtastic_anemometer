; Un ambiente per ogni sketch. Le cartelle restano compilabili anche con l'Arduino IDE.
;   pio run                                  compila il firmware SIM7080
;   pio run -e bluetooth                     compila un altro sketch
;   pio run -e bridge -t upload              carica il convertitore per provare il modem
;   pio run -e sim7080 -t upload             carica sulla scheda
;   pio device monitor                       monitor seriale

[platformio]
default_envs = sim7080

[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#ee0d4a8c1df19cafdcbde814a4830297a96a9251
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
extra_scripts = pre:pio_sketch_dir.py

[env:sim7080]
custom_sketch_dir = anemometro_sim7080_coap
; test/ contiene un Arduino.h finto per i test sul computer
build_src_filter = +<*> -<test/>

; Stesso firmware con vento finto, invio ogni minuto e comandi AT sulla USB: prova modem e server senza sensori
[env:sim7080_dummy]
custom_sketch_dir = anemometro_sim7080_coap
build_src_filter = +<*> -<test/>
build_flags = -DDUMMY_WIND -DREPORT_PERIOD_S=60 -DSIM7080_TRACE

[env:bridge]
custom_sketch_dir = sim7080_serial_bridge
build_src_filter = +<*> -<test/>

[env:bluetooth]
custom_sketch_dir = anemometro_bluetooth_stringaunica
lib_deps = meshtastic/Meshtastic@0.0.7

[env:compensated]
board = seeed-xiao-afruitnrf52-nrf52840-sense
custom_sketch_dir = meshtastic_davis_anemometer_compensated
lib_deps =
    meshtastic/Meshtastic@0.0.7
    mprograms/QMC5883LCompass@1.2.3
    seeed-studio/Seeed Arduino LSM6DS3@2.0.7
