<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Wind Sensor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a1628;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.3em;
      font-weight: 500;
      color: #7eb8f7;
      margin-bottom: 24px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1em;
      font-weight: 500;
      cursor: pointer;
    }

    #btnConnect { background: #1a56db; color: white; }
    #btnConnect:disabled { background: #334; color: #888; }
    #btnDisconnect { background: #7f1d1d; color: #fca5a5; display: none; }

    #status {
      text-align: center;
      font-size: 0.85em;
      color: #667;
      margin-bottom: 28px;
    }
    #status.ok  { color: #4ade80; }
    #status.err { color: #f87171; }

    .grid {
      display: grid;
      /* minmax(0, ...): un SVG largo non deve allargare la colonna oltre lo schermo */
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      margin-bottom: 12px;
    }

    .card.wide {
      grid-column: 1 / -1;
    }

    .card {
      background: #111f3a;
      border-radius: 16px;
      padding: 18px 14px 14px;
      text-align: center;
      border: 1px solid #1e3a5f;
    }

    .card-label {
      font-size: 0.72em;
      color: #4a7ab5;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }

    .card-value {
      font-size: 2.4em;
      font-weight: 600;
      color: #e8f4ff;
      line-height: 1;
    }

    .card-unit {
      font-size: 0.75em;
      color: #4a7ab5;
      margin-top: 6px;
    }

    #rawData {
      background: #0d1a2e;
      border: 1px solid #1e3a5f;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.85em;
      color: #7eb8f7;
      word-break: break-all;
      margin-bottom: 12px;
      min-height: 40px;
    }

    /* Rosa dei venti */
    #rose { width: 100%; max-width: 340px; display: block; margin: 0 auto; }
    #rose .ring   { fill: #0d1a2e; stroke: #1e3a5f; stroke-width: 2; }
    #rose .tick   { stroke: #2a4a75; stroke-width: 1.5; }
    #rose .tick.major { stroke: #4a7ab5; stroke-width: 2.5; }
    #rose .wind   { fill: #4a7ab5; font-size: 11px; text-anchor: middle; dominant-baseline: middle; }
    #rose .wind.on { fill: #fbbf24; font-weight: 700; }
    #rose .card4  { fill: #7eb8f7; font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    #needle { transition: transform 0.6s ease-out; }
    #needle .head { fill: #fbbf24; }
    #needle .tail { fill: #475569; }
    #rose .hub    { fill: #e8f4ff; }
    #rose.nodata #needle { opacity: 0.25; }

    /* Grafico ultima ora */
    .chart-card { text-align: left; }
    .chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .chart-head .card-label { margin-bottom: 0; }
    #chartInfo { font-size: 0.75em; color: #7eb8f7; min-height: 1.2em; }
    #chart { width: 100%; height: 260px; display: block; touch-action: pan-y; }
    #chart .grid-line { stroke: #1e3a5f; stroke-width: 1; }
    #chart .axis-text { fill: #4a7ab5; font-size: 10px; }
    #chart .mean { fill: none; stroke: #60a5fa; stroke-width: 2; }
    #chart .max  { fill: none; stroke: #fb923c; stroke-width: 1.5; }
    #chart .arrow { fill: #94a3b8; }
    #chart .cursor { stroke: #e8f4ff; stroke-width: 1; stroke-dasharray: 3 3; }
    .legend { display: flex; gap: 14px; font-size: 0.72em; color: #4a7ab5; margin-top: 6px; flex-wrap: wrap; }
    .legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
    #chartMsg { font-size: 0.8em; color: #667; text-align: center; padding: 20px 0; }

    #lastUpdate {
      text-align: center;
      font-size: 0.75em;
      color: #334;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <h1>&#127811; Wind Sensor</h1>

  <div class="btn-row">
    <button id="btnConnect">Connetti</button>
    <button id="btnDisconnect">Disconnetti</button>
  </div>
  <p id="status">Non connesso</p>

  <div id="rawData">In attesa di dati...</div>

  <div class="grid">
    <div class="card">
      <div class="card-label">Velocità</div>
      <div class="card-value" id="speed">--</div>
      <div class="card-unit">nodi</div>
    </div>
    <div class="card">
      <div class="card-label">Media</div>
      <div class="card-value" id="mean">--</div>
      <div class="card-unit">nodi</div>
    </div>
    <div class="card">
      <div class="card-label">Raffica 3 s</div>
      <div class="card-value" id="gust">--</div>
      <div class="card-unit">nodi</div>
    </div>
    <div class="card">
      <div class="card-label">Max 5 min</div>
      <div class="card-value" id="max">--</div>
      <div class="card-unit">nodi</div>
    </div>
    <div class="card wide">
      <div class="card-label">Direzione</div>
      <svg id="rose" class="nodata" viewBox="-150 -150 300 300" aria-label="Rosa dei venti"></svg>
      <div class="card-value" id="dirDeg">--</div>
      <div class="card-unit" id="dirComp"></div>
    </div>
    <div class="card wide chart-card">
      <div class="chart-head">
        <div class="card-label">Ultima ora</div>
        <div id="chartInfo"></div>
      </div>
      <svg id="chart" aria-label="Vento nell'ultima ora"></svg>
      <div id="chartMsg">Caricamento...</div>
      <div class="legend">
        <span><i style="background:#60a5fa"></i>media 5 min</span>
        <span><i style="background:#fb923c"></i>raffica max</span>
        <span>&#8593; verso in cui soffia</span>
        <a href="storico.html" style="margin-left:auto;color:#7eb8f7;text-decoration:none">Storico &rarr;</a>
      </div>
    </div>
  </div>

  <p id="lastUpdate"></p>

  <script>
    const SERVICE = "a0010000-0001-0001-0001-000000000001";
    const CHAR    = "a0010000-0001-0001-0001-000000000002";

    const btnConnect    = document.getElementById("btnConnect");
    const btnDisconnect = document.getElementById("btnDisconnect");
    const statusEl      = document.getElementById("status");
    const rawDataEl     = document.getElementById("rawData");
    const speedEl       = document.getElementById("speed");
    const meanEl        = document.getElementById("mean");
    const maxEl         = document.getElementById("max");
    const gustEl        = document.getElementById("gust");
    const dirDegEl      = document.getElementById("dirDeg");
    const dirCompEl     = document.getElementById("dirComp");
    const lastUpEl      = document.getElementById("lastUpdate");

    // Nome della stazione su InfluxDB (NODE_NAME nel firmware)
    const STATION = "first_anemometer";
    const SVG_NS  = "http://www.w3.org/2000/svg";

    function svgEl(tag, attrs, parent) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(el);
      return el;
    }

    // ── Rosa dei venti ──────────────────────────────────────
    const WINDS = ["Tramontana", "Grecale", "Levante", "Scirocco",
                   "Ostro", "Libeccio", "Ponente", "Maestrale"];
    const roseEl = document.getElementById("rose");
    const windLabels = [];
    let needleAngle = null;

    function polar(deg, r) {
      const a = (deg - 90) * Math.PI / 180;
      return [r * Math.cos(a), r * Math.sin(a)];
    }

    function buildRose() {
      svgEl("circle", { cx: 0, cy: 0, r: 96, class: "ring" }, roseEl);
      for (let deg = 0; deg < 360; deg += 11.25) {
        const major = deg % 45 === 0;
        const [x1, y1] = polar(deg, major ? 82 : 89);
        const [x2, y2] = polar(deg, 96);
        svgEl("line", { x1, y1, x2, y2, class: major ? "tick major" : "tick" }, roseEl);
      }
      WINDS.forEach((name, i) => {
        const [x, y] = polar(i * 45, 120);
        const t = svgEl("text", { x, y, class: "wind" }, roseEl);
        t.textContent = name;
        windLabels.push(t);
      });
      ["N", "E", "S", "O"].forEach((name, i) => {
        const [x, y] = polar(i * 90, 70);
        svgEl("text", { x, y, class: "card4" }, roseEl).textContent = name;
      });
      // L'ago punta da dove arriva il vento, come la banderuola
      const needle = svgEl("g", { id: "needle" }, roseEl);
      svgEl("polygon", { points: "0,-80 9,0 -9,0", class: "head" }, needle);
      svgEl("polygon", { points: "0,58 9,0 -9,0", class: "tail" }, needle);
      svgEl("circle", { cx: 0, cy: 0, r: 6, class: "hub" }, roseEl);
    }

    function setRose(deg) {
      // Ruota per la via più breve: da 350° a 10° fa 20°, non un giro all'indietro
      if (needleAngle === null) needleAngle = deg;
      else needleAngle += ((deg - needleAngle) % 360 + 540) % 360 - 180;
      document.getElementById("needle").style.transform = "rotate(" + needleAngle + "deg)";
      roseEl.classList.remove("nodata");
      const sector = Math.round(((deg % 360) + 360) % 360 / 45) % 8;
      windLabels.forEach((t, i) => t.classList.toggle("on", i === sector));
      return WINDS[sector];
    }

    buildRose();

    // ── Grafico ultima ora ──────────────────────────────────
    const chartEl     = document.getElementById("chart");
    const chartMsgEl  = document.getElementById("chartMsg");
    const chartInfoEl = document.getElementById("chartInfo");
    let history = [];
    let layout  = null;

    const pad2 = n => n.toString().padStart(2, "0");
    const hhmm = d => pad2(d.getHours()) + ":" + pad2(d.getMinutes());

    function drawChart() {
      chartEl.textContent = "";
      layout = null;
      if (!history.length) return;

      const W = chartEl.clientWidth || 320, H = 260;
      const L = 30, R = 8, T = 8, B = 46;   // margini; in basso asse orario e frecce
      chartEl.setAttribute("viewBox", "0 0 " + W + " " + H);

      const SPAN = 3600;
      const tEnd = Date.now() / 1000, tStart = tEnd - SPAN;
      const top = Math.max(5, ...history.map(p => p.max));
      const step = top <= 10 ? 2 : top <= 25 ? 5 : 10;
      const yMax = Math.ceil(top / step) * step;
      const x = t => L + (t - tStart) / SPAN * (W - L - R);
      const y = v => T + (1 - v / yMax) * (H - T - B);
      layout = { x, tStart, W, L, R };

      for (let v = 0; v <= yMax; v += step) {
        svgEl("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), class: "grid-line" }, chartEl);
        svgEl("text", { x: L - 5, y: y(v) + 3, "text-anchor": "end", class: "axis-text" }, chartEl).textContent = v;
      }
      // Tacche ogni 10 minuti
      const first = new Date(tStart * 1000);
      first.setSeconds(0, 0);
      first.setMinutes(Math.ceil(first.getMinutes() / 10) * 10);
      for (let d = first; d.getTime() / 1000 <= tEnd; d = new Date(d.getTime() + 600e3)) {
        const t = d.getTime() / 1000;
        svgEl("line", { x1: x(t), x2: x(t), y1: T, y2: H - B, class: "grid-line" }, chartEl);
        svgEl("text", { x: x(t), y: H - B + 13, "text-anchor": "middle", class: "axis-text" }, chartEl)
          .textContent = hhmm(d);
      }

      // Linee spezzate dove mancano dati per più di 15 minuti
      const path = key => {
        let d = "", prev = null;
        for (const p of history) {
          d += (prev === null || p.t - prev > 900 ? "M" : "L") + x(p.t).toFixed(1) + "," + y(p[key]).toFixed(1);
          prev = p.t;
        }
        return d;
      };
      svgEl("path", { d: path("max"),  class: "max"  }, chartEl);
      svgEl("path", { d: path("mean"), class: "mean" }, chartEl);

      // Una freccia di direzione per ogni invio
      const arrowY = H - 14;
      for (const p of history) {
        const g = svgEl("g", { transform: "translate(" + x(p.t).toFixed(1) + "," + arrowY +
                                ") rotate(" + ((p.dir + 180) % 360) + ")" }, chartEl);
        svgEl("polygon", { points: "0,-7 4,5 0,2 -4,5", class: "arrow" }, g);
      }

      svgEl("line", { id: "cursor", x1: 0, x2: 0, y1: T, y2: H - B, class: "cursor", visibility: "hidden" }, chartEl);
    }

    function showPoint(evt) {
      if (!layout || !history.length) return;
      const rect = chartEl.getBoundingClientRect();
      const px = (evt.clientX - rect.left) * layout.W / rect.width;
      let best = history[0];
      for (const p of history) {
        if (Math.abs(layout.x(p.t) - px) < Math.abs(layout.x(best.t) - px)) best = p;
      }
      const cursor = document.getElementById("cursor");
      cursor.setAttribute("x1", layout.x(best.t));
      cursor.setAttribute("x2", layout.x(best.t));
      cursor.setAttribute("visibility", "visible");
      chartInfoEl.textContent = hhmm(new Date(best.t * 1000)) + "  media " + best.mean.toFixed(1) +
        "  max " + best.max.toFixed(1) + " kn  " + best.dir + "°";
    }

    function showLatest() {
      const p = history[history.length - 1];
      chartInfoEl.textContent = p ? "ultimo " + hhmm(new Date(p.t * 1000)) + "  media " +
        p.mean.toFixed(1) + "  max " + p.max.toFixed(1) + " kn" : "";
      const cursor = document.getElementById("cursor");
      if (cursor) cursor.setAttribute("visibility", "hidden");
    }

    chartEl.addEventListener("pointermove", showPoint);
    chartEl.addEventListener("pointerdown", showPoint);
    chartEl.addEventListener("pointerleave", showLatest);

    async function loadHistory() {
      try {
        const resp = await fetch("api/history?station=" + encodeURIComponent(STATION) + "&range=1h", { cache: "no-cache" });
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        history = (await resp.json()).points;
        chartMsgEl.textContent = history.length ? "" : "Nessun dato nell'ultima ora";
        chartMsgEl.style.display = history.length ? "none" : "block";
        drawChart();
        showLatest();
        // Senza Bluetooth la rosa mostra l'ultima direzione ricevuta dal server
        if (!bleChar && history.length) {
          const last = history[history.length - 1];
          dirDegEl.textContent = last.dir + "°";
          dirCompEl.textContent = setRose(last.dir) + " (ultimo invio)";
        }
      } catch (e) {
        chartMsgEl.style.display = "block";
        chartMsgEl.textContent = "Storico non disponibile (" + e.message + ")";
      }
    }

    let resizeTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { drawChart(); showLatest(); }, 150);
    });

    let gattServer = null;
    let bleChar    = null;
    let pollTimer  = null;

    function parseAndUpdate(str) {
      rawDataEl.textContent = str;

      const s = str.match(/S:([\d.]+)/);
      const m = str.match(/M:([\d.]+)/);
      // Il firmware SIM7080 manda R (raffica degli ultimi 3 s), gli altri X (massima)
      const r = str.match(/R:([\d.]+)/);
      const x = str.match(/X:([\d.]+)/);
      const d = str.match(/D:(\d+)/);
      const c = str.match(/D:\d+\s+(\w+)/);

      if (s) speedEl.textContent   = parseFloat(s[1]).toFixed(1);
      if (m) meanEl.textContent    = parseFloat(m[1]).toFixed(1);
      if (r) gustEl.textContent    = parseFloat(r[1]).toFixed(1);
      if (x) maxEl.textContent     = parseFloat(x[1]).toFixed(1);
      if (d) {
        const deg = parseInt(d[1]);
        dirDegEl.textContent  = deg + "°";
        const wind = setRose(deg);
        dirCompEl.textContent = (c ? c[1] + " · " : "") + wind;
      }

      const now = new Date();
      lastUpEl.textContent = "Aggiornato: " +
        now.getHours()  .toString().padStart(2, "0") + ":" +
        now.getMinutes().toString().padStart(2, "0") + ":" +
        now.getSeconds().toString().padStart(2, "0");
    }

    async function pollRead() {
      if (!bleChar) return;
      try {
        const val = await bleChar.readValue();
        parseAndUpdate(new TextDecoder().decode(val));
      } catch(e) {
        // connessione caduta, il timer verrà fermato da setDisconnected
      }
    }

    function setConnected(device) {
      statusEl.textContent = "Connesso a " + device.name;
      statusEl.className = "ok";
      btnConnect.disabled = true;
      btnDisconnect.style.display = "block";
      pollTimer = setInterval(pollRead, 1000);
    }

    function setDisconnected() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      statusEl.textContent = "Disconnesso";
      statusEl.className = "err";
      btnConnect.disabled = false;
      btnConnect.textContent = "Riconnetti";
      btnDisconnect.style.display = "none";
      gattServer = null;
      bleChar    = null;
    }

    btnConnect.addEventListener("click", async () => {
      try {
        btnConnect.disabled = true;
        statusEl.textContent = "Ricerca in corso...";
        statusEl.className = "";

        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: "WindSensor" }],
          optionalServices: [SERVICE]
        });

        statusEl.textContent = "Connessione...";
        device.addEventListener("gattserverdisconnected", setDisconnected);

        gattServer    = await device.gatt.connect();
        const service = await gattServer.getPrimaryService(SERVICE);
        bleChar       = await service.getCharacteristic(CHAR);

        const val = await bleChar.readValue();
        parseAndUpdate(new TextDecoder().decode(val));

        setConnected(device);

      } catch (err) {
        statusEl.textContent = "Errore: " + err.message;
        statusEl.className = "err";
        btnConnect.disabled = false;
      }
    });

    btnDisconnect.addEventListener("click", () => {
      if (gattServer && gattServer.connected) {
        gattServer.disconnect();
      }
      setDisconnected();
    });
    loadHistory();
    setInterval(loadHistory, 5 * 60 * 1000);
  </script>
</body>
</html>
